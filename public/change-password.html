<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tài khoản và bảo mật · CaRảnh</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="page">

<div data-layout="plain" data-require="any"></div>
<main class="stack-lg">
  <h1 style="align-self:center;margin:0;font-size:28px">Tài khoản &amp; bảo mật</h1>

  <form class="form-card" data-auth="password" style="align-self:center;max-width:440px;width:100%">
    <div><h2 style="margin:0;font-size:20px">Đổi mật khẩu</h2><p class="lead">Nhập mật khẩu hiện tại và mật khẩu mới của bạn.</p></div>
    <div class="field"><label for="cur">Mật khẩu hiện tại</label><input id="cur" type="password" autocomplete="current-password"></div>
    <div class="field"><label for="pw">Mật khẩu mới</label><input id="pw" type="password" data-meter placeholder="Tối thiểu 8 ký tự" autocomplete="new-password"></div>
    <div class="field"><label for="pw2">Nhập lại mật khẩu mới</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <button type="submit" class="btn btn-primary btn-lg">Lưu mật khẩu mới</button>
  </form>

  <form class="form-card" data-auth="email" style="align-self:center;max-width:440px;width:100%">
    <div><h2 style="margin:0;font-size:20px">Đổi email đăng nhập</h2><p class="lead">Dùng email mới từ lần đăng nhập sau.</p></div>
    <div class="field"><label for="newmail">Email mới</label><input id="newmail" type="email" placeholder="ban@email.com" autocomplete="email"></div>
    <div class="field"><label for="pwe">Mật khẩu hiện tại</label><input id="pwe" type="password" autocomplete="current-password"></div>
    <button type="submit" class="btn btn-lg">Lưu email mới</button>
  </form>

  <form class="form-card" data-auth="delete" style="align-self:center;max-width:440px;width:100%">
    <div><h2 style="margin:0;font-size:20px">Xóa tài khoản</h2><p class="lead">Toàn bộ hồ sơ và dữ liệu của bạn sẽ bị xóa vĩnh viễn, không khôi phục được.</p></div>
    <div class="field"><label for="pwd">Mật khẩu hiện tại</label><input id="pwd" type="password" autocomplete="current-password"></div>
    <label class="remember"><input type="checkbox" id="sure"> Tôi hiểu tài khoản sẽ bị xóa vĩnh viễn</label>
    <button type="submit" class="btn btn-danger btn-lg">Xóa tài khoản</button>
  </form>

  <p class="muted small" style="margin:0;text-align:center"><a data-back href="jobs.html" style="font-weight:700">Quay lại hồ sơ</a></p>
</main>
</div>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
