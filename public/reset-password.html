<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt lại mật khẩu · CaRảnh</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="page">

<div data-layout="plain" data-cta="login"></div>
<main class="stack-lg">
  <form class="form-card" data-auth="reset" style="align-self:center;max-width:440px;width:100%">
    <div><h1>Đặt mật khẩu mới</h1><p class="lead">Nhập mật khẩu mới cho tài khoản của bạn.</p></div>
    <div class="field"><label for="pw">Mật khẩu mới</label><input id="pw" type="password" data-meter placeholder="Tối thiểu 8 ký tự" autocomplete="new-password"></div>
    <div class="field"><label for="pw2">Nhập lại mật khẩu</label><input id="pw2" type="password" placeholder="••••••••" autocomplete="new-password"></div>
    <button type="submit" class="btn btn-primary btn-lg">Lưu mật khẩu</button>
    <p class="muted small" style="margin:0;text-align:center"><a href="forgot-password.html" style="font-weight:700">Yêu cầu liên kết mới</a></p>
  </form>
</main>
</div>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
