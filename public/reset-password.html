<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt lại mật khẩu · CaRảnh</title>
  <meta name="description" content="Đặt mật khẩu mới cho tài khoản CaRảnh của bạn." />
  <meta name="theme-color" content="#0E6F64" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body>
<div class="page">

<div data-layout="plain" data-cta="login"></div>
<main class="stack-lg">
  <form class="form-card tw-self-center tw-max-w-[440px] tw-w-full" data-auth="reset">
    <div><h1>Đặt mật khẩu mới</h1><p class="lead">Nhập mật khẩu mới cho tài khoản của bạn.</p></div>
    <div class="field"><label for="pw">Mật khẩu mới</label><input id="pw" type="password" data-meter placeholder="Tối thiểu 8 ký tự" autocomplete="new-password"></div>
    <div class="field"><label for="pw2">Nhập lại mật khẩu</label><input id="pw2" type="password" placeholder="••••••••" autocomplete="new-password"></div>
    <button type="submit" class="btn btn-primary btn-lg">Lưu mật khẩu</button>
    <p class="muted small tw-m-0 tw-text-center"><a class="tw-font-bold" href="forgot-password.html">Yêu cầu liên kết mới</a></p>
  </form>
</main>
</div>
<script src="/js/main.js" defer></script>
<script src="/js/auth.js" defer></script>
</body>
</html>
