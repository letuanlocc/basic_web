<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hồ sơ · CaRảnh</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="page">

<div data-layout="seeker" data-active="profile"></div>
<main class="stack">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="jobs.html">Trang chủ</a> → <span>Hồ sơ</span></nav>
  <form class="form-card" style="max-width:900px;align-self:center;gap:22px">
    <h1 style="font-size:24px;letter-spacing:.02em">HỒ SƠ</h1>
    <div class="row" style="align-items:flex-start;gap:28px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px"><button type="button" class="drop" style="width:130px;height:170px" data-todo="Ảnh đại diện">Ảnh đại diện</button><span class="badge ok b">NGƯỜI TÌM VIỆC</span></div>
      <div class="cols" style="flex:1 1 360px">
        <div class="field full"><label for="pn">Họ tên *</label><input id="pn" type="text" placeholder="Nhập họ tên" ></div>
        <div class="field"><label for="py">Năm sinh *</label><input id="py" type="number" placeholder="Nhập năm sinh" ></div>
        <div class="field"><label for="pp">Số điện thoại *</label><input id="pp" type="tel" placeholder="Nhập số điện thoại" ></div>
      </div>
    </div>
    <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))">
      <div class="field"><label for="pg">Giới tính *</label><select id="pg"><option>Chọn giới tính</option><option>Nữ</option><option>Nam</option><option>Khác</option></select></div><div class="field"><label for="pa">Nơi cư trú (quận) *</label><select id="pa"><option>Chọn khu vực</option><option>Hải Châu</option><option>Thanh Khê</option><option>Sơn Trà</option><option>Liên Chiểu</option><option>Ngũ Hành Sơn</option></select></div><div class="field"><label for="pl">Trình độ ngoại ngữ</label><select id="pl"><option>Chưa có</option><option>Giao tiếp cơ bản</option><option>Khá (IELTS 5.0–6.0 hoặc tương đương)</option><option>Tốt (IELTS 6.5+ hoặc tương đương)</option></select></div>
    </div>
    <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">
      <fieldset><legend>Hình thức muốn làm *</legend><div class="chips"><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Hình thức">Online</button><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Hình thức">Offline</button><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Hình thức">Cả hai</button></div></fieldset>
      <fieldset><legend>Thời gian rảnh (chọn nhiều) *</legend><div class="chips"><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Thời gian rảnh">Sáng</button><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Thời gian rảnh">Chiều</button><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Thời gian rảnh">Tối</button><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Thời gian rảnh">Cuối tuần</button></div></fieldset>
    </div>
    <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">
      <div class="field"><label for="ps">Điểm mạnh</label><textarea id="ps" rows="3" placeholder="Ví dụ: giao tiếp tốt, nhanh nhẹn"></textarea></div>
      <div class="field"><label for="pw">Điểm cần cải thiện</label><textarea id="pw" rows="3" placeholder="Ví dụ: chưa quen pha chế"></textarea></div>
    </div>
    <fieldset><legend>Đã có kinh nghiệm làm thêm chưa?</legend><div class="chips"><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Kinh nghiệm">Chưa có</button><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Kinh nghiệm">Đã có</button></div></fieldset>
    <div class="field"><label for="pe">Ghi rõ kinh nghiệm</label><textarea id="pe" rows="3" placeholder="Ví dụ: phục vụ quán cà phê 6 tháng"></textarea></div>
    <div class="field"><label for="pt">Lịch rảnh chi tiết <span class="hint">(hiện trên thẻ ứng viên)</span></label><input id="pt" type="text" placeholder="Ví dụ: Tối T2–T6, cả ngày Chủ nhật" maxlength="100"></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary btn-lg" data-todo="Lưu hồ sơ">Lưu hồ sơ</button></div>
  </form>
</main>
<footer class="foot"><div class="wrap"><span>© CaRảnh · Bản quyền thuộc nhóm phát triển</span><a href="overview.html">Tìm hiểu các chức năng</a></div></footer>
</div>
<script src="/js/main.js"></script>
</body>
</html>
