<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Việc làm dành cho bạn · CaRảnh</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="page">

<div data-layout="seeker" data-active="home"></div>
<main class="stack">
  <section class="panel" aria-labelledby="flt" style="flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:10px 16px">
    <h2 id="flt" style="font-size:14px;font-weight:600;color:var(--text-2)">Lọc và sắp xếp</h2>
    <div class="chips scroll-x" role="group" aria-label="Lọc việc"><button type="button" class="chip " aria-pressed="true" data-todo="Bộ lọc: Tất cả">Tất cả</button>
<button type="button" class="chip " aria-pressed="false" data-todo="Bộ lọc: Online">Online</button>
<button type="button" class="chip " aria-pressed="false" data-todo="Bộ lọc: Offline">Offline</button>
<button type="button" class="chip " aria-pressed="false" data-todo="Bộ lọc: Lương cao nhất">Lương cao nhất</button></div>
  </section>
  <div class="title-row"><h1>Việc làm dành cho bạn</h1><span class="muted small">0 việc</span></div>
  <div class="empty" role="status"><strong style="font-size:16px">Chưa có dữ liệu</strong></div>
</main>
<footer class="foot"><div class="wrap"><span>© CaRảnh · Bản quyền thuộc nhóm phát triển</span><a href="overview.html">Tìm hiểu các chức năng</a></div></footer>
</div>
<script src="/js/main.js"></script>
</body>
</html>
