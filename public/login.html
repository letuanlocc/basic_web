<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập · CaRảnh</title>
  <meta name="description" content="Đăng nhập CaRảnh để ứng tuyển, đăng ký lịch làm hoặc quản lý tin tuyển dụng." />
  <meta name="theme-color" content="#0E6F64" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body>
<div class="page">

<div data-layout="plain" data-cta="register"></div>
<main class="stack-lg">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Trang chủ</a> → <span>Đăng nhập</span></nav>
  <div class="row tw-justify-center tw-items-start tw-gap-6">
    <form class="form-card tw-flex-[1_1_360px] tw-max-w-[440px]" data-auth="login">
      <div><h1>Chào mừng quay lại</h1><p class="lead">Đăng nhập để xem chi tiết công việc, ứng tuyển và đăng ký lịch làm.</p></div>
      <div class="field"><label for="acc">Email hoặc số điện thoại</label><input id="acc" type="text" placeholder="ví dụ: ban@email.com hoặc 0912345678" autocomplete="username"></div>
      <div class="field"><div class="row between tw-items-baseline"><label for="pw">Mật khẩu</label><a class="link-btn" href="forgot-password.html">Quên mật khẩu?</a></div><input id="pw" type="password" placeholder="••••••" autocomplete="current-password"></div>
      <label class="remember"><input type="checkbox" id="remember" checked> Ghi nhớ đăng nhập trên thiết bị này</label>
      <button type="submit" class="btn btn-primary btn-lg">Đăng nhập</button>
      <p class="muted small tw-m-0 tw-text-center">Bạn chưa có tài khoản? <a class="tw-font-bold" href="register.html">Đăng ký ngay</a></p>
    </form>
  </div>
</main>
</div>
<script src="/js/main.js" defer></script>
<script src="/js/auth.js" defer></script>
</body>
</html>
