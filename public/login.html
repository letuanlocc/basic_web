<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập · CaRảnh</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="page">

<div data-layout="plain" data-cta="register"></div>
<main class="stack-lg">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Trang chủ</a> → <span>Đăng nhập</span></nav>
  <div class="row" style="justify-content:center;align-items:flex-start;gap:24px">
    <form class="form-card" data-auth="login" style="flex:1 1 360px;max-width:440px">
      <div><h1>Chào mừng quay lại</h1><p class="lead">Đăng nhập để xem chi tiết công việc, ứng tuyển và đăng ký lịch làm.</p></div>
      <div class="field"><label for="acc">Email hoặc số điện thoại</label><input id="acc" type="text" placeholder="ví dụ: ban@email.com hoặc 0912345678" autocomplete="username"></div>
      <div class="field"><div class="row between" style="align-items:baseline"><label for="pw">Mật khẩu</label><a class="link-btn" href="forgot-password.html">Quên mật khẩu?</a></div><input id="pw" type="password" placeholder="••••••" autocomplete="current-password"></div>
      <label class="remember"><input type="checkbox" id="remember" checked> Ghi nhớ đăng nhập trên thiết bị này</label>
      <button type="submit" class="btn btn-primary btn-lg">Đăng nhập</button>
      <p class="muted small" style="margin:0;text-align:center">Bạn chưa có tài khoản? <a href="register.html" style="font-weight:700">Đăng ký ngay</a></p>
    </form>
  </div>
</main>
</div>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
