<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quên mật khẩu · CaRảnh</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="page">

<div data-layout="plain" data-cta="login"></div>
<main class="stack-lg">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Trang chủ</a> → <a href="login.html">Đăng nhập</a> → <span>Quên mật khẩu</span></nav>
  <form class="form-card" data-auth="forgot" style="align-self:center;max-width:440px;width:100%">
    <div><h1>Quên mật khẩu</h1><p class="lead">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết để bạn đặt mật khẩu mới.</p></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="ban@email.com" autocomplete="email"></div>
    <button type="submit" class="btn btn-primary btn-lg">Gửi liên kết đặt lại</button>
    <p class="muted small" style="margin:0;text-align:center"><a href="login.html" style="font-weight:700">Quay lại đăng nhập</a></p>
  </form>
</main>
</div>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
