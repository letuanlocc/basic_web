<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hồ sơ cửa hàng · CaRảnh</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="page">

<div data-layout="employer" data-active="shop"></div>
<main class="stack">
  <form class="form-card" style="max-width:820px;align-self:center;gap:20px">
    <div><h1 style="font-size:26px">Hồ sơ cửa hàng</h1><p class="lead">Ứng viên thấy các thông tin này ở mục "4. Thông tin nhà tuyển dụng" trên mọi tin.</p></div>
    <div class="field"><label for="s_name">Tên công ty / cửa hàng *</label><input id="s_name" type="text" placeholder="Ví dụ: Quán cà phê Mộc" ></div>
    <fieldset><legend>Hình thức làm việc *</legend><div class="chips"><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Hình thức">Offline</button><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Hình thức">Online</button><button type="button" class="chip lg solid" aria-pressed="false" data-todo="Hình thức">Cả hai</button></div></fieldset>
    <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))">
      <div class="field"><label for="s_field">Lĩnh vực *</label><select id="s_field"><option>Chọn lĩnh vực</option><option>Ăn uống – F&amp;B</option><option>Bán lẻ</option><option>Giáo dục – gia sư</option><option>Văn phòng – nhập liệu</option><option>Sáng tạo nội dung</option></select></div>
      <div class="field"><label for="s_city">Tỉnh / thành phố *</label><select id="s_city"><option>Chọn tỉnh / thành</option><option>Đà Nẵng</option><option>Hà Nội</option><option>TP. Hồ Chí Minh</option></select></div>
      <div class="field"><label for="s_ward">Phường / xã *</label><input id="s_ward" type="text" placeholder="Ví dụ: Phường Hải Châu" ></div>
      <div class="field"><label for="s_addr">Địa chỉ cụ thể *</label><input id="s_addr" type="text" placeholder="Số nhà, đường" ></div>
      <div class="field"><label for="s_phone">SĐT cửa hàng *</label><input id="s_phone" type="tel" placeholder="10 số, bắt đầu bằng 0" ></div>
      <div class="field"><label for="s_web">Website / fanpage</label><input id="s_web" type="text" placeholder="facebook.com/tenquan" ></div>
    </div>
    <div class="field"><span class="lab">Ảnh nơi làm việc * (ít nhất 1 ảnh)</span>
      <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px"><button type="button" class="drop" data-todo="Tải ảnh"><span>+ Mặt tiền cửa hàng</span></button><button type="button" class="drop" data-todo="Tải ảnh"><span>+ Khu vực làm việc</span></button><button type="button" class="drop" data-todo="Tải ảnh"><span>+ Quầy / bên trong</span></button></div></div>
    <div class="form-actions"><button type="submit" class="btn btn-primary btn-lg" data-todo="Lưu hồ sơ cửa hàng">Lưu hồ sơ cửa hàng</button></div>
  </form>
</main>
<footer class="foot"><div class="wrap"><span>© CaRảnh · Bản quyền thuộc nhóm phát triển</span><a href="overview.html">Tìm hiểu các chức năng</a></div></footer>
</div>
<script src="/js/main.js"></script>
</body>
</html>
